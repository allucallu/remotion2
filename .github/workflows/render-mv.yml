name: Render Music Video (MV)

on:
  workflow_dispatch:
    inputs:
      crf:
        description: "CRF value for H.264 quality (18 = visual lossless, 23 = default)"
        required: false
        default: "18"
      concurrency:
        description: "Number of rendering threads or percentage (default: 100%)"
        required: false
        default: "100%"

jobs:
  render-mv:
    name: Render Full MV to MP4
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Render Music Video (MV)
        run: |
          mkdir -p out
          npx remotion render MV out/Krisis_Hati_dan_Ekonomi_MV.mp4 \
            --crf=${{ github.event.inputs.crf || '18' }} \
            --concurrency=${{ github.event.inputs.concurrency || '100%' }} \
            --gl=angle

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Krisis-Hati-dan-Ekonomi-MV
          path: out/Krisis_Hati_dan_Ekonomi_MV.mp4
          retention-days: 14

