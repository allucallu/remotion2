name: Render 4K MP4 Package

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID to render (leave empty to render all)"
        required: false
        default: ""
      crf:
        description: "CRF value for H.264 video quality (default: 18)"
        required: false
        default: "18"

permissions:
  contents: read

concurrency:
  group: remotion-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render 4K videos (solid black background) and create ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle Remotion project
        run: npx remotion bundle src/index.ts build

      - name: Create composition manifest
        shell: bash
        env:
          SELECTED_COMPOSITION: ${{ github.event.inputs.composition }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          registry = Path("src/compositions/registry.tsx").read_text(encoding="utf-8")
          matches = re.findall(r'from "(\.\.?/[^"]+)"', registry)
          composition_ids = []
          for rel_path in matches:
              target_dir = (Path("src/compositions") / rel_path).resolve()
              registration_file = target_dir / "index.tsx" if target_dir.is_dir() else Path(f"{target_dir}.tsx")
              if not registration_file.is_file():
                  raise SystemExit(f"Missing registration module: {registration_file}")
              registration_source = registration_file.read_text(encoding="utf-8")
              match = re.search(r'\bid:\s*"([^"]+)"', registration_source)
              if match is None:
                  raise SystemExit(f"No composition ID found in: {registration_file}")
              composition_ids.append(match.group(1))

          if not composition_ids:
              raise SystemExit("No compositions were found in src/compositions/registry.tsx")
          if len(composition_ids) != len(set(composition_ids)):
              raise SystemExit("Duplicate composition IDs were found in the registry")

          selected = os.environ.get("SELECTED_COMPOSITION", "").strip()
          if selected:
              if selected not in composition_ids:
                  raise SystemExit(f"Selected composition '{selected}' not found in registry. Available: {composition_ids}")
              render_ids = [selected]
          else:
              render_ids = composition_ids

          Path("render-list.txt").write_text("\n".join(render_ids) + "\n", encoding="utf-8")
          print(f"Prepared {len(render_ids)} composition(s) for rendering: {render_ids}")
          PY

      - name: Render compositions as 4K MP4 with solid black background
        shell: bash
        env:
          CRF_VALUE: ${{ github.event.inputs.crf || '18' }}
        run: |
          set -euo pipefail
          mkdir -p release/videos
          while IFS= read -r composition_id; do
            [ -z "$composition_id" ] && continue
            echo "::group::Rendering ${composition_id} (4K 3840x2160, H.264, solid black background)"
            npx remotion render build "${composition_id}" "release/videos/${composition_id}.mp4" \
              --codec=h264 \
              --crf="${CRF_VALUE}" \
              --pixel-format=yuv420p \
              --width=3840 \
              --height=2160 \
              --concurrency=1 \
              --overwrite
            echo "::endgroup::"
          done < render-list.txt

      - name: Verify rendered 4K video dimensions and solid black format
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying rendered video specifications..."
          for video in release/videos/*.mp4; do
            [ -f "$video" ] || continue
            output="$(ffprobe -v error -select_streams v:0 \
              -show_entries stream=width,height,pix_fmt \
              -of csv=p=0 "$video" | tr -d '\r')"
            echo "Verified: $video -> $output"
            # Accept yuv420p or yuvj420p (8-bit 4:2:0 opaque video)
            if [[ "$output" != "3840,2160,yuv420p," && "$output" != "3840,2160,yuvj420p," && "$output" != "3840,2160,yuv420p" && "$output" != "3840,2160,yuvj420p" ]]; then
              echo "::error::Unexpected video stream format for ${video}: '${output}'. Expected 3840,2160 with yuv420p/yuvj420p" >&2
              exit 1
            fi
          done
          echo "All rendered MP4 videos are verified 4K (3840x2160) with solid opaque pixel format."

      - name: Package 4K videos and metadata into ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          videos = sorted(Path("release/videos").glob("*.mp4"))
          if not videos:
              raise SystemExit("Error: No rendered MP4 files were found in release/videos/")

          # Find metadata CSV files (prioritizing adobe_stock_metadata.csv)
          csv_candidates = [
              Path("adobe_stock_metadata.csv"),
              Path("metadata.csv"),
          ] + sorted(Path(".").glob("*.csv"))

          csv_files = []
          seen_names = set()
          for p in csv_candidates:
              if p.is_file() and p.name not in seen_names:
                  csv_files.append(p)
                  seen_names.add(p.name)

          if not csv_files:
              print("Warning: No metadata CSV file was found in workspace root!", file=sys.stderr)

          archive_dir = Path("release")
          archive_dir.mkdir(parents=True, exist_ok=True)
          archive = archive_dir / "remotion-4k-renders.zip"

          with ZipFile(archive, "w", compression=ZIP_DEFLATED, compresslevel=9) as zip_file:
              # Add all rendered 4K MP4 videos
              for video in videos:
                  zip_file.write(video, arcname=video.name)
                  size_mb = video.stat().st_size / (1024 * 1024)
                  print(f"  + Added 4K MP4: {video.name} ({size_mb:.2f} MB)")

              # Add metadata CSV file(s)
              for csv_file in csv_files:
                  zip_file.write(csv_file, arcname=csv_file.name)
                  print(f"  + Added metadata CSV: {csv_file.name}")

          archive_size_mb = archive.stat().st_size / (1024 * 1024)
          print(f"\nSuccessfully created {archive} ({archive_size_mb:.2f} MB) containing {len(videos)} 4K video(s) and {len(csv_files)} CSV file(s).")
          PY

      - name: Upload 4K ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: remotion-4k-renders
          path: release/remotion-4k-renders.zip
          if-no-files-found: error
          retention-days: 14
