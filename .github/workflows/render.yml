name: Render Adobe Stock Assets

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remotion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and typecheck
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Build Remotion bundle
        run: npm run build

  render:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - composition: LT-VioletFrame
            filename: LT-VioletFrame.mov
          - composition: LT-LimeVector
            filename: LT-LimeVector.mov
          - composition: LT-CopperBracket
            filename: LT-CopperBracket.mov
          - composition: LT-CobaltRail
            filename: LT-CobaltRail.mov
          - composition: LT-CyanNotch
            filename: LT-CyanNotch.mov
          - composition: LT-CoralBracket
            filename: LT-CoralBracket.mov
          - composition: LT-GoldSlash
            filename: LT-GoldSlash.mov
          - composition: LT-SageWing
            filename: LT-SageWing.mov
          - composition: LT-SkyDock
            filename: LT-SkyDock.mov
          - composition: LT-AzureTerminal
            filename: LT-AzureTerminal.mov
          - composition: PixelFireLoop
            filename: PixelFireLoop.mov
          - composition: CatPawTrail
            filename: CatPawTrail.mov
          - composition: SneakerFootstepTrail
            filename: SneakerFootstepTrail.mov
          - composition: seztk01
            filename: seztk01.mov
          - composition: seztk01-CurvedTrail
            filename: seztk01-CurvedTrail.mov
          - composition: jejak-kucing
            filename: jejak-kucing.mov
          - composition: jejak-kucing-LoopArc
            filename: jejak-kucing-LoopArc.mov
          - composition: FootstepsVertical
            filename: FootstepsVertical.mov
          - composition: FootstepsCurve
            filename: FootstepsCurve.mov
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Render 4K ProRes 4444 with alpha
        run: >-
          npx remotion render "${{ matrix.composition }}" "out/${{ matrix.filename }}"
          --scale=2
          --codec=prores
          --prores-profile=4444
          --pixel-format=yuva444p10le
          --image-format=png
          --muted
          --concurrency=2
      - name: Upload rendered asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.composition }}-4K-alpha
          path: out/${{ matrix.filename }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
