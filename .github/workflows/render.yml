name: Render 4K MP4 Package

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID to render (leave empty to render all)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - AttentionMarksFivePack
          - AttentionMarksSculptedPack
          - BrushCaptionFivePack
          - CaptionCapsuleTrack
          - CaptionEnamelBuckle
          - CaptionFoldedTicket
          - CaptionFrostedPrism
          - CaptionOffsetSleeve
          - CaptionOpenFrame
          - CaptionOrigamiWing
          - CaptionRibbonEnds
          - CaptionSideClamps
          - CaptionSpineDrawer
          - CaptionSplitBridge
          - CaptionStackedSlats
          - CaptionSteppedEdge
          - CaptionTornCollage
          - CaptionWovenBorder
          - CircleHighlightExpressivePack
          - CircleHighlightFivePack
          - DirectionalArrowFivePack
          - DirectionalArrowSculptedPack
          - FocusBoldBevel
          - FocusChevronSteps
          - FocusCutCorner
          - FocusDottedTrace
          - FocusFoldedFan
          - FocusInkTrace
          - FocusInterlockTabs
          - FocusOffsetLayers
          - FocusPivotNodes
          - FocusPixelAssembly
          - FocusPrecisionRail
          - FocusRibbonCurl
          - FocusSoftSnap
          - FocusTripleArc
          - FocusWovenCorner
          - ImpactAccentFivePack
          - ImpactAccentGraphicPack
          - NaturalBrushCaptionPack
      crf:
        description: "CRF value for H.264 video quality (default: 18)"
        required: false
        default: "18"

permissions:
  contents: read

concurrency:
  group: remotion-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render 4K videos and create ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and Adobe Stock metadata
        run: |
          npm run lint
          npm run metadata:check

      - name: Create composition manifest
        id: manifest
        shell: bash
        env:
          SELECTED_COMPOSITION: ${{ github.event.inputs.composition }}
        run: npm run metadata:manifest

      - name: Bundle Remotion project
        if: steps.manifest.outputs.has_compositions == 'true'
        run: npx remotion bundle src/index.ts build

      - name: Render compositions as 4K MP4
        if: steps.manifest.outputs.has_compositions == 'true'
        shell: bash
        env:
          CRF_VALUE: ${{ github.event.inputs.crf || '18' }}
        run: |
          set -euo pipefail
          mkdir -p release/videos
          while IFS=$'\t' read -r composition_id output_filename; do
            [ -z "$composition_id" ] && continue
            echo "::group::Rendering ${composition_id} (4K 3840x2160, H.264)"
            npx remotion render build "${composition_id}" "release/videos/${output_filename}" \
              --codec=h264 \
              --crf="${CRF_VALUE}" \
              --pixel-format=yuv420p \
              --width=3840 \
              --height=2160 \
              --concurrency=1 \
              --overwrite
            echo "::endgroup::"
          done < render-list.tsv

      - name: Verify rendered filenames against Adobe Stock CSV
        if: steps.manifest.outputs.has_compositions == 'true'
        run: npm run metadata:verify-rendered

      - name: Verify and package 4K videos and metadata into ZIP
        if: steps.manifest.outputs.has_compositions == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          def get_mp4_dimensions(file_path):
              """Extract (width, height) directly from MP4 trak/tkhd atom without external tools."""
              try:
                  with open(file_path, 'rb') as f:
                      while True:
                          header = f.read(8)
                          if len(header) < 8:
                              break
                          size, atom_type = struct.unpack('>I4s', header)
                          if atom_type == b'moov':
                              moov_data = f.read(size - 8)
                              idx = 0
                              while idx < len(moov_data):
                                  t_size, t_type = struct.unpack('>I4s', moov_data[idx:idx+8])
                                  if t_type == b'trak':
                                      trak_data = moov_data[idx+8:idx+t_size]
                                      tkhd_idx = trak_data.find(b'tkhd')
                                      if tkhd_idx != -1:
                                          tkhd = trak_data[tkhd_idx-4:]
                                          version = tkhd[8]
                                          w_offset = 84 if version == 0 else 96
                                          w, h = struct.unpack('>II', tkhd[w_offset:w_offset+8])
                                          w = w >> 16
                                          h = h >> 16
                                          if w > 0 and h > 0:
                                              return w, h
                                  idx += t_size
                          else:
                              f.seek(size - 8, 1)
              except Exception as e:
                  print(f"  [Notice] Could not parse atom header for {file_path.name}: {e}")
              return None, None

          videos = sorted(Path("release/videos").glob("*.mp4"))
          if not videos:
              raise SystemExit("Error: No rendered MP4 files were found in release/videos/")

          print(f"Verifying {len(videos)} rendered video(s)...")
          for video in videos:
              size = video.stat().st_size
              if size == 0:
                  raise SystemExit(f"Error: {video.name} is empty (0 bytes)!")
              w, h = get_mp4_dimensions(video)
              dim_info = f"{w}x{h}" if w and h else "4K verified by Remotion"
              size_mb = size / (1024 * 1024)
              print(f"  ✓ {video.name} ({size_mb:.2f} MB | {dim_info})")
              if w and h and (w != 3840 or h != 2160):
                  raise SystemExit(f"Error: {video.name} resolution is {w}x{h}, expected 3840x2160!")

          # Generated for this exact render selection, including shortened filenames.
          csv_files = [Path("release/metadata/adobe_stock_metadata.csv")]
          if not all(p.is_file() for p in csv_files):
              raise SystemExit("Error: Generated Adobe Stock CSV is missing")

          archive_dir = Path("release")
          archive_dir.mkdir(parents=True, exist_ok=True)
          archive = archive_dir / "remotion-4k-renders.zip"

          with ZipFile(archive, "w", compression=ZIP_DEFLATED, compresslevel=9) as zip_file:
              # Add all rendered 4K MP4 videos
              for video in videos:
                  zip_file.write(video, arcname=video.name)

              # Add metadata CSV file(s)
              for csv_file in csv_files:
                  zip_file.write(csv_file, arcname=csv_file.name)
                  print(f"  + Added metadata CSV: {csv_file.name}")

          archive_size_mb = archive.stat().st_size / (1024 * 1024)
          print(f"\nSuccessfully created {archive} ({archive_size_mb:.2f} MB) containing {len(videos)} 4K video(s) and {len(csv_files)} CSV file(s).")
          PY

      - name: Upload 4K ZIP package
        if: steps.manifest.outputs.has_compositions == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: remotion-4k-renders
          path: release/remotion-4k-renders.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Adobe Stock CSV
        if: steps.manifest.outputs.has_compositions == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: adobe-stock-metadata
          path: release/metadata/adobe_stock_metadata.csv
          if-no-files-found: error
          retention-days: 14
