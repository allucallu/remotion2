name: Render 4K MP4 Package

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remotion-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render 4K videos and create ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle Remotion project
        run: npx remotion bundle src/index.ts build

      - name: Create composition manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          registry = Path("src/compositions/registry.tsx").read_text(encoding="utf-8")
          module_names = re.findall(r'from "\.\./([^"]+)"', registry)
          composition_ids = []
          for module_name in module_names:
              registration_file = Path("src") / module_name / "index.tsx"
              if not registration_file.is_file():
                  raise SystemExit(f"Missing registration module: {registration_file}")
              registration_source = registration_file.read_text(encoding="utf-8")
              match = re.search(r'\bid:\s*"([^"]+)"', registration_source)
              if match is None:
                  raise SystemExit(f"No composition ID found in: {registration_file}")
              composition_ids.append(match.group(1))
          if not composition_ids:
              raise SystemExit("No compositions were found in src/compositions/registry.tsx")
          if len(composition_ids) != len(set(composition_ids)):
              raise SystemExit("Duplicate composition IDs were found in the registry")
          Path("render-list.txt").write_text("\n".join(composition_ids) + "\n", encoding="utf-8")
          print(f"Prepared {len(composition_ids)} compositions for rendering.")
          PY

      - name: Render all compositions as opaque 4K MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/videos
          while IFS= read -r composition_id; do
            echo "Rendering ${composition_id}"
            npx remotion render build "${composition_id}" "release/videos/${composition_id}.mp4" \
              --codec=h264 \
              --crf=18 \
              --pixel-format=yuv420p \
              --width=3840 \
              --height=2160 \
              --concurrency=1 \
              --overwrite
          done < render-list.txt

      - name: Create single ZIP package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          videos = sorted(Path("release/videos").glob("*.mp4"))
          if not videos:
              raise SystemExit("No rendered MP4 files were found")

          archive = Path("release/remotion-4k-renders.zip")
          with ZipFile(archive, "w", compression=ZIP_DEFLATED, compresslevel=9) as zip_file:
              for video in videos:
                  zip_file.write(video, arcname=video.name)
          print(f"Created {archive} with {len(videos)} 4K MP4 files.")
          PY

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: remotion-4k-renders
          path: release/remotion-4k-renders.zip
          if-no-files-found: error
          retention-days: 14
